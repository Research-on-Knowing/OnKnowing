# Site
name: 'Insights on Knowing'
description: 'Short stories, sharp observations, and practical wisdom designed to make the unseen mechanics of work and life visible.'
favicon: 'assets/images/favicon.ico'
baseurl: '/OnKnowing'
url: 'https://research-on-knowing.github.io'
# disqus: 'demowebsite'
email: 'info@researchonknowing.com' 
# mailchimp-list: 'https://wowthemes.us11.list-manage.com/subscribe/post?u=8aeb20a530e124561927d3bd8&amp;id=8c3d2d214b'

include: ["_pages"]
permalink: /:title/

# Plugins
plugins: 
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-paginate
  - jekyll-seo-tag
  
authors:
    dan:
      name:           Dan
      site:           https://www.researchonknowing.com
      avatar:         assets/images/Dan.jpg
      bio:            "<strong>Dan Douglass</strong> is Owner of Research on Knowing LLC. He leads organizational vision, operations, and strategic initiatives, focusing on the practical integration of epistemology within business, technology, and execution systems."
      email:          dan@researchonknowing.com
    jamie:
      name:           Jamie
      site:           https://www.researchonknowing.com
      avatar:         assets/images/Jamie.jpg
      bio:            "<strong>Jamie Douglass</strong> is Principal Scientist Emeritus at Research on Knowing LLC. He guides foundational research, scientific methodology, and conceptual frameworks—exploring how shifted perspectives reveal unseen structures in how we learn, reason, and work."
      email:          jamie@researchonknowing.com

# Defaults
defaults:

  # all posts
  - scope:
      path: "_posts"
    values:
      layout: post
      author: jamie
      avatar: /assets/images/Jamie.jpg 
      
  # all pages
  - scope:
      path: "_pages"
    values:
      layout: page
      
# Syntax
markdown: kramdown
highlighter: rouge

# Paginate
paginate: 10



# Exclude metadata and development time dependencies (like Grunt plugins)
exclude: [README.markdown, package.json, grunt.js, Gruntfile.js, Gruntfile.coffee, node_modules]
